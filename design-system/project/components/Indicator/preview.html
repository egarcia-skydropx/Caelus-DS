<!-- @dsCard group="Indicators" height=150 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 12px 16px; }
</style>
<script>
  const { Indicator } = window.Caelus;
  const h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', null,
      h('div', { className: 'row' },
        h(Indicator, { color: 'green' }, 'Disponible'),
        h(Indicator, { color: 'yellow' }, 'En pausa'),
        h(Indicator, { color: 'red' }, 'Con incidencia'),
        h(Indicator, { color: 'gray' }, 'Inactivo')),
      h('div', { className: 'row' },
        h(Indicator, { type: 'alert', count: 1, 'aria-label': '1 alerta' }),
        h(Indicator, { type: 'counter', count: 3, 'aria-label': '3 envíos pendientes' }),
        h(Indicator, { type: 'icon', 'aria-label': 'Paso completado' }),
        h(Indicator, { type: 'stepper', 'aria-label': 'Paso actual' }),
        h(Indicator, { type: 'charge' }, 'Generando guías…'))));
</script>
