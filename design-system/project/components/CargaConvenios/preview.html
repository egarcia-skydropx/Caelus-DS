<div id="root"></div>
<style>
  body { margin: 0; background: var(--core-surface-light-white); font-family: var(--font-sans); }
  .box { padding: 20px; border: 1px solid var(--core-border-secondary-gray200); border-radius: 8px; max-width: 522px; }
</style>
<script>
  const { CargaConvenios } = window.Caelus;
  const h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { padding: 16, display: 'grid', gap: 12 } },
      h('div', { className: 'box' }, h(CargaConvenios, { value: 25, statusText: 'Tiempo estimado 1 seg' })),
      h('div', { className: 'box' }, h(CargaConvenios, { state: 'error' })),
      h('div', { className: 'box' }, h(CargaConvenios, { state: 'exito', description: h('span', null, 'A partir de ahora se mostrará tu convenio en todas tus cotizaciones. Para configurarlo según tus preferencias, puedes ', h('a', { href: '#' }, 'crear un reporte'), '.') }))
    ));
</script>
