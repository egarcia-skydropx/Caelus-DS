<!-- @dsCard group="Loader" height=150 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 16px; }
  .dark { background: var(--core-gray-900); border-radius: 8px; padding: 12px; display: inline-flex; gap: 12px; }
</style>
<script>
  const { Loader } = window.Caelus;
  const h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'row' },
      h(Loader, { size: 'sm', label: 'Cotizando envío' }),
      h(Loader, { label: 'Generando guías' }),
      h(Loader, { size: 'lg', label: 'Cargando paqueterías' }),
      h(Loader, { size: 'sm', track: false }),
      h('span', { className: 'dark' }, h(Loader, { size: 'sm', dark: true }), h(Loader, { size: 'sm', dark: true, track: false }))));
</script>
