<!-- @dsCard group="Dropdowns" height=340 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .wrap { display: flex; gap: 48px; padding: 16px; align-items: flex-start; min-height: 300px; }
</style>
<script>
  const { DropdownButton } = window.Caelus;
  const h = React.createElement;
  const ico = d => h('svg', { viewBox: '0 0 18 18', fill: 'none', stroke: 'currentColor', strokeWidth: 1.4, strokeLinecap: 'round', strokeLinejoin: 'round' }, h('path', { d }));
  const items = [
    { id: 'dl', label: 'Descargar guía', icon: ico('M9 3v8m0 0l-3-3m3 3l3-3M3.5 13.5h11') },
    { id: 'dup', label: 'Duplicar envío', icon: ico('M6 6h8v8H6zM4 12V4h8') },
    { id: 'track', label: 'Ver rastreo', icon: ico('M9 16s5-4.5 5-8.5a5 5 0 10-10 0C4 11.5 9 16 9 16z') },
    { type: 'separator', id: 's' },
    { id: 'cancel', label: 'Cancelar envío', danger: true, trailing: ico('M7 4H4v10h3m4-8l3 3-3 3m3-3H7') }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' },
      h(DropdownButton, { label: 'Acciones', items }),
      h(DropdownButton, { type: 'icon', label: 'Más acciones del envío', items, open: true, onOpenChange: () => {} })));
</script>
