<!-- @dsCard group="Buttons" height=200 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 12px 16px; }
  .tall { padding-top: 52px; }
</style>
<script>
  const { ButtonGroup } = window.Caelus;
  const h = React.createElement;
  const sv = (d) => h('svg', { viewBox: '0 0 20 20', fill: 'none' }, h('path', { d, stroke: 'currentColor', strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round' }));
  const left = sv('M12.5 4.5L7 10l5.5 5.5');
  const right = sv('M7.5 4.5L13 10l-5.5 5.5');
  const down = sv('M10 3.5v9m0 0l-3.5-3.5M10 12.5l3.5-3.5M3.5 13.5v2h13v-2');
  const mark = sv('M5.5 3.5h9v13l-4.5-3-4.5 3v-13z');
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', null,
      h('div', { className: 'row tall' },
        h(ButtonGroup, { 'aria-label': 'Periodo', items: [
          { label: 'Días', selected: true, tooltip: 'Envíos por día' }, { label: 'Meses', selected: false }, { label: 'Años', selected: false }] }),
        h(ButtonGroup, { 'aria-label': 'Paginación', items: [
          { icon: left, 'aria-label': 'Página anterior' }, { icon: right, 'aria-label': 'Página siguiente' }] })),
      h('div', { className: 'row' },
        h(ButtonGroup, { 'aria-label': 'Reporte de guías', items: [
          { icon: down, label: 'Descargar' }, { label: '12k', stat: true }] }),
        h(ButtonGroup, { 'aria-label': 'Guardar', items: [
          { label: 'Guardar cambios' }, { icon: mark, 'aria-label': 'Guardar como plantilla' }] }))));
</script>
