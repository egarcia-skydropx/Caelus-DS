<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .stack { display: grid; gap: 16px; padding: 16px; justify-items: start; }
</style>
<script>
  const { NotificationPushup } = window.Caelus;
  const h = React.createElement;
  const close = () => {};
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'stack' },
      h(NotificationPushup, { kind: 'referido', platform: 'pro', onClose: close }),
      h(NotificationPushup, { kind: 'creditos', platform: 'se', title: '¡Ganaste créditos por tu referido!', message: 'Úsalos en tu próximo envío.', onClose: close }),
      h(NotificationPushup, { kind: 'beneficio', platform: 'ei', date: 'Vence el 30 de noviembre', onClose: close })));
</script>
