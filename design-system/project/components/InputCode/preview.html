<!-- @dsCard group="Forms" height=620 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .stack { display: grid; gap: 16px; padding: 16px; max-width: 536px; }
</style>
<script>
  const { InputCode } = window.Caelus;
  const h = React.createElement;
  const schema = '{\n  "type": "object",\n  "properties": {\n    "access_token": { "type": "string" },\n    "expires_in": { "type": "integer" }\n  }\n}';
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'stack' },
      h(InputCode, { type: 'token', code: 'POST /api/v1/oauth/token' }),
      h(InputCode, { type: 'post', code: "curl -X POST 'https://pro.skydropx.com/api/v1/oauth/token' \\ -H 'Content-Type: application/json' \\ -H 'Authorization: Bearer {{BEARER_TOKEN}}'" }),
      h(InputCode, { type: 'esquema', code: schema }),
      h(InputCode, { type: 'cuerpo', params: [
        { name: 'client_id', required: true },
        { name: 'client_secret', required: true },
        { name: 'grant_type', required: true },
        { name: 'scope' }
      ] })));
</script>
