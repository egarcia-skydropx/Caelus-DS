<div id="root"></div>
<style>
  body { margin: 0; background: var(--core-surface-gray-lighter-50); font-family: var(--font-sans); }
</style>
<script>
  const { CardRecolecciones, Badge } = window.Caelus;
  const h = React.createElement;
  const base = {
    number: '123456789', carrier: { name: 'Fedex' },
    origin: { name: 'Bodega principal - Centro', detail: '64000 - Centro Monterrey' },
    schedule: { date: 'Lun - 08/10/2022', time: '9:00 am - 7:00 pm' }, packages: '20', weight: '11kg'
  };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { padding: 16, display: 'grid', gap: 12 } },
      h(CardRecolecciones, Object.assign({}, base, { status: h(Badge, { theme: 'green', size: 'small' }, 'Programada') })),
      h('div', { style: { maxWidth: 343 } }, h(CardRecolecciones, Object.assign({}, base, { mobile: true, number: 'DMC123458', carrier: { name: 'Fedex', service: 'Standard Overnight' } })))
    ));
</script>
