<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-gray-light-100); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 20px 16px; }
</style>
<script>
  const { ButtonDownloadApp } = window.Caelus;
  const h = React.createElement;
  // Neutral placeholder: the consumer passes the official store logo.
  const ph = h('svg', { viewBox: '0 0 38 38', fill: 'none' },
    h('rect', { x: 4, y: 4, width: 30, height: 30, rx: 8, stroke: 'currentColor', strokeWidth: 2 }),
    h('path', { d: 'M19 12v12m0 0l-5-5m5 5l5-5', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }));
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'row' },
      h(ButtonDownloadApp, { store: 'appstore', badge: ph, href: '#' }),
      h(ButtonDownloadApp, { store: 'googleplay', badge: ph, href: '#' })));
</script>
