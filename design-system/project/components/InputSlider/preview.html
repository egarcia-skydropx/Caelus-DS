<!-- @dsCard group="Forms" height=400 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .stack { display: grid; gap: 32px; padding: 16px 24px; max-width: 560px; }
  .lbl { margin: 0 0 8px; font-size: 14px; font-weight: 500; color: var(--core-text-primary-gray900); }
</style>
<script>
  const { InputSlider } = window.Caelus;
  const h = React.createElement;
  const money = v => '$' + v;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'stack' },
      h(InputSlider, { type: 'value', tooltip: true, max: 1000, step: 10, defaultValue: 320, formatValue: money, 'aria-label': 'Precio máximo de la guía' }),
      h('div', null, h('p', { className: 'lbl' }, 'Peso del paquete (kg)'),
        h(InputSlider, { type: 'range', min: 0, max: 70, defaultValue: [5, 25], minLabel: 'Peso mínimo', maxLabel: 'Peso máximo' })),
      h(InputSlider, { type: 'volume', defaultValue: 60, 'aria-label': 'Volumen de notificaciones', style: { maxWidth: 246 } }),
      h(InputSlider, { type: 'with-data', min: 0, max: 150, defaultValue: 50, marks: [0, 50, 100, 150], 'aria-label': 'Días de historial' })));
</script>
