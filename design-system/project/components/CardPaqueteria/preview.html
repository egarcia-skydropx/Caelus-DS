<!-- @dsCard group="Cards" height=708 -->
<div id="root"></div>
<style>
  body { margin: 0; background: var(--core-surface-gray-lighter-50); font-family: var(--font-sans); }
</style>
<script>
  const { CardPaqueteria } = window.Caelus;
  const h = React.createElement;
  function Demo() {
    const [on, setOn] = React.useState(true);
    return h(CardPaqueteria, { name: 'FedEx', showWarning: true, enabled: on, onToggle: e => setOn(e.target.checked) });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { padding: 16, display: 'grid', gap: 12 } },
      h(Demo),
      h(CardPaqueteria, { variant: 'v2', name: 'FedEx', convenioState: 'conectado' }),
      h(CardPaqueteria, { variant: 'v2', name: 'Estafeta', convenioState: 'intermitencia', statusLabel: 'Activada' }),
      h(CardPaqueteria, { variant: 'busqueda' })
    ));
</script>
