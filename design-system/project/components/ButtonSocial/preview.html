<!-- @dsCard group="Buttons" height=200 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; }
  .gray { background: var(--core-surface-gray-light-100); }
</style>
<script>
  const { ButtonSocial } = window.Caelus;
  const h = React.createElement;
  // Neutral placeholder mark (not a brand logo): the consumer passes the official logo.
  const mark = h('svg', { viewBox: '0 0 24 24', fill: 'none' },
    h('rect', { x: 3, y: 3, width: 18, height: 18, rx: 4, stroke: 'currentColor', strokeWidth: 1.5 }),
    h('circle', { cx: 12, cy: 12, r: 3, fill: 'currentColor' }));
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', null,
      h('div', { className: 'row' },
        h(ButtonSocial, { size: 'lg', icon: mark, provider: 'google' }, 'Continuar con Google'),
        h(ButtonSocial, { size: 'base', icon: mark, provider: 'facebook' }, 'Iniciar sesión con Facebook')),
      h('div', { className: 'row' },
        h(ButtonSocial, { size: 'sm', icon: mark, provider: 'github' }, 'Continuar con GitHub'),
        h(ButtonSocial, { size: 'xs', icon: mark }, 'Continuar con otra cuenta')),
      h('div', { className: 'row gray' },
        h(ButtonSocial, { outline: false, icon: mark, provider: 'google' }, 'Continuar con Google'),
        h(ButtonSocial, { outline: false, size: 'sm', icon: mark, provider: 'facebook' }, 'Iniciar sesión con Facebook'))));
</script>
