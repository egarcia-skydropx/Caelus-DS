<!-- @dsCard group="Modals" height=640 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .grid { display: grid; gap: 16px; padding: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
</style>
<script>
  const { Modal } = window.Caelus;
  const h = React.createElement;
  const box = h('svg', { viewBox: '0 0 96 96', width: 96, height: 96, fill: 'none', 'aria-hidden': 'true', style: { color: 'var(--core-theme-primary-primary-900)' } },
    h('path', { d: 'M20 34l28-12 28 12v36L48 82 20 70z', stroke: 'currentColor', strokeWidth: 2, strokeLinejoin: 'round' }),
    h('path', { d: 'M20 34l28 12 28-12M48 46v36', stroke: 'currentColor', strokeWidth: 2, strokeLinejoin: 'round' }),
    h('path', { d: 'M58 62h10M58 66h6', stroke: 'var(--core-theme-primary-contrast-600)', strokeWidth: 2, strokeLinecap: 'round' }));
  const noop = () => {};
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' },
      h(Modal, { inline: true, type: 'informativo', title: 'Guía generada', illustration: box, onClose: noop,
        description: 'Tu guía de FedEx ya está lista. Imprímela y pégala en el paquete antes de que llegue la recolección.',
        secondaryAction: { label: 'Cerrar' }, primaryAction: { label: 'Descargar guía' } }),
      h(Modal, { inline: true, type: 'confirmacion', title: '¿Quieres programar la recolección?', illustration: box, onClose: noop,
        description: 'La paquetería pasará por tu paquete mañana entre 9:00 y 18:00 h.',
        secondaryAction: { label: 'Cancelar' }, primaryAction: { label: 'Programar' } }),
      h(Modal, { inline: true, type: 'critico', title: '¿Seguro que quieres cancelar este envío?', onClose: noop,
        description: 'La guía quedará inválida y no podrás usarla de nuevo.',
        secondaryAction: { label: 'No, volver' }, primaryAction: { label: 'Sí, cancelar envío' } })));
</script>
