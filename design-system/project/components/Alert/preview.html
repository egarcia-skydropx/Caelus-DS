<!-- @dsCard group="Alerts" height=538 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .stack { display: grid; gap: 12px; padding: 16px; max-width: 560px; }
</style>
<script>
  const { Alert } = window.Caelus;
  const h = React.createElement;
  const ring = h('svg', { viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor', strokeWidth: 1.5 }, h('circle', { cx: 8, cy: 8, r: 6.5 }));
  const arrow = h('svg', { viewBox: '0 0 18 18', fill: 'none', stroke: 'currentColor', strokeWidth: 1.5, strokeLinecap: 'round' }, h('path', { d: 'M6 12l6-6m-4.5 0H12v4.5' }));
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'stack' },
      h(Alert, { color: 'success', icon: ring, title: 'Guía generada', action: { label: 'Ver guía', icon: arrow } }, 'Tu envío quedó registrado y ya puedes descargar la guía.'),
      h(Alert, { color: 'danger', icon: ring, title: 'No pudimos crear el envío', action: { label: 'Reintentar', icon: arrow } }, 'Revisa el código postal de destino e inténtalo de nuevo.'),
      h(Alert, { color: 'warning', icon: ring }, 'Tu saldo es bajo. Recarga para no detener tus envíos.'),
      h(Alert, { color: 'info', icon: ring }, 'Las recolecciones se programan para el siguiente día hábil.'),
      h(Alert, { color: 'default', icon: ring }, 'No hay cambios pendientes en esta orden.'),
      h(Alert, { color: 'orange', icon: ring }, 'Esta paquetería tiene demoras en tu zona.')));
</script>
