<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px 16px; align-items: start; padding: 16px; }
</style>
<script>
  const { InputColor } = window.Caelus;
  const h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' },
      h(InputColor, { label: 'Color de marca' }),
      h(InputColor, { label: 'Color de etiqueta', defaultValue: '#3D3DAB' }),
      h(InputColor, { label: 'Color deshabilitado', defaultValue: '#9CA3AF', disabled: true })));
</script>
