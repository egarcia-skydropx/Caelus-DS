<!-- @dsCard group="Tabs" height=300 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .wrap { display: grid; gap: 20px; padding: 16px; }
  .dark { background: var(--shiphub-layout-header-bg); padding: 12px; border-radius: 8px; justify-self: start; }
</style>
<script>
  const { TabNav } = window.Caelus;
  const h = React.createElement;
  const ico = d => h('svg', { viewBox: '0 0 18 18', fill: 'none', stroke: 'currentColor', strokeWidth: 1.4, strokeLinecap: 'round', strokeLinejoin: 'round' }, h('path', { d }));
  const base = [
    { id: 'cuenta', label: 'Mi cuenta', icon: ico('M9 9a3 3 0 100-6 3 3 0 000 6zm-5.5 6a5.5 5.5 0 0111 0') },
    { id: 'direcciones', label: 'Direcciones', icon: ico('M9 16s5-4.5 5-8.5a5 5 0 10-10 0C4 11.5 9 16 9 16z') },
    { id: 'guias', label: 'Guías', icon: ico('M9 3v8m0 0l-3-3m3 3l3-3M3.5 13.5h11') },
    { id: 'facturacion', label: 'Facturación', icon: ico('M3 5h12v9H3zM3 8h12'), disabled: true }
  ];
  function Row(p) {
    const [v, setV] = React.useState(p.start);
    return h(TabNav, Object.assign({ tabs: base, value: v, onChange: setV, 'aria-label': 'Configuración de la cuenta' }, p));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' },
      h(Row, { variant: 'tab', start: 'cuenta' }),
      h(Row, { variant: 'pills', start: 'guias' }),
      h(Row, { variant: 'underline', start: 'direcciones' }),
      h('div', { className: 'dark' }, h(Row, { variant: 'tab', dark: true, start: 'guias' }))));
</script>
