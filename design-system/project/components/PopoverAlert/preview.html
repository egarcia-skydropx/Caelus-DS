<!-- @dsCard group="Popovers" height=560 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .stack { display: grid; gap: 24px; padding: 16px; justify-items: start; }
</style>
<script>
  const { PopoverAlert } = window.Caelus;
  const h = React.createElement;
  const go = { label: 'Completar datos' };
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'stack' },
      h(PopoverAlert, { severity: 'warning', title: 'Datos fiscales pendientes', action: go, onClose: () => {} }, 'Agrega tu RFC para poder facturar tus envíos de este mes.'),
      h(PopoverAlert, { severity: 'info', title: 'Nueva paquetería', action: { label: 'Ver tarifas' }, onClose: () => {} }, 'Ya puedes cotizar con DHL Express en tu cuenta.'),
      h(PopoverAlert, { severity: 'danger', onClose: () => {} }, 'Tu método de pago fue rechazado. Actualízalo para seguir creando guías.'),
      h(PopoverAlert, { severity: 'primary', direction: 'bottom', onClose: () => {} }, 'Configura tu dirección de origen.'),
      h(PopoverAlert, { severity: 'warning', showPopover: false, 'aria-label': 'Acción pendiente' })));
</script>
