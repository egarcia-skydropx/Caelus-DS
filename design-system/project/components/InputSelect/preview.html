<!-- @dsCard group="Forms" height=235 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px 16px; align-items: start; padding: 16px; }
</style>
<script>
  const { InputSelect } = window.Caelus;
  const h = React.createElement;
  const opts = [
    { value: 'est', label: 'Estafeta', group: 'Nacional' },
    { value: 'dhl', label: 'DHL Express', group: 'Nacional' },
    { value: 'fdx', label: 'FedEx', group: 'Nacional' },
    { value: 'ups', label: 'UPS', group: 'Internacional' },
    { value: 'pqx', label: 'Paquetexpress', group: 'Internacional' }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' },
      h(InputSelect, { label: 'Paquetería', info: 'Paquetería preferida para tus envíos', placeholder: 'Selecciona una paquetería', options: opts }),
      h(InputSelect, { label: 'Paquetería', options: opts, defaultValue: 'dhl', helperText: 'Se usará en tus próximas guías.' }),
      h(InputSelect, { label: 'Paquetería', size: 'sm', placeholder: 'Selecciona una paquetería', options: opts, error: 'Este campo es obligatorio.' }),
      h(InputSelect, { label: 'Paquetería', options: opts, defaultValue: 'est', disabled: true })));
</script>
