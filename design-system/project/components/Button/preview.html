<!-- @dsCard group="Buttons" height=232 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; }
  .lbl { width: 72px; font-size: 12px; color: var(--core-text-secondary-gray500); }
</style>
<script>
  const { Button } = window.Caelus;
  const h = React.createElement;
  const dots = h('svg', { viewBox: '0 0 18 18', fill: 'currentColor' },
    h('circle', { cx: 4, cy: 9, r: 1.5 }), h('circle', { cx: 9, cy: 9, r: 1.5 }), h('circle', { cx: 14, cy: 9, r: 1.5 }));
  const types = ['primary', 'secondary', 'tertiary', 'alert', 'convenios', 'dashed'];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', null,
      h('div', { className: 'row' }, h('span', { className: 'lbl' }, 'Type'),
        types.map(t => h(Button, { key: t, type: t }, t[0].toUpperCase() + t.slice(1)))),
      h('div', { className: 'row' }, h('span', { className: 'lbl' }, 'Size'),
        h(Button, { size: 'base' }, 'Base'), h(Button, { size: 'sm' }, 'Small'), h(Button, { size: 'xs' }, 'Extra small'),
        h(Button, { shape: 'square', icon: dots, 'aria-label': 'Más opciones' }),
        h(Button, { shape: 'circle', icon: dots, 'aria-label': 'Más opciones' })),
      h('div', { className: 'row' }, h('span', { className: 'lbl' }, 'Disabled'),
        h(Button, { disabled: true }, 'Primary'), h(Button, { type: 'secondary', disabled: true }, 'Secondary'),
        h(Button, { type: 'tertiary', disabled: true }, 'Tertiary'))));
</script>
