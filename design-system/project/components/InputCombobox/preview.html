<!-- @dsCard group="Forms" height=354 -->
<div id="root"></div>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--core-surface-light-white); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px 16px; align-items: start; padding: 16px; }
</style>
<script>
  const { InputCombobox } = window.Caelus;
  const h = React.createElement;
  const opts = [
    { value: 'est', label: 'Estafeta', group: 'Nacional' },
    { value: 'dhl', label: 'DHL Express', group: 'Nacional' },
    { value: 'fdx', label: 'FedEx', group: 'Nacional' },
    { value: 'ups', label: 'UPS', group: 'Internacional' },
    { value: 'pqx', label: 'Paquetexpress', group: 'Internacional' }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' },
      h(InputCombobox, { label: 'Paquetería', info: 'Elige o escribe para buscar', placeholder: 'Selecciona una opción', options: opts, defaultOpen: true }),
      h('div', { style: { display: 'grid', gap: 24 } },
        h(InputCombobox, { label: 'Paquetería', options: opts, defaultValue: 'fdx', helperText: 'Puedes cambiarla después.' }),
        h(InputCombobox, { label: 'Paquetería', size: 'sm', placeholder: 'Selecciona una opción', options: opts, error: 'Este campo es obligatorio.' }),
        h(InputCombobox, { label: 'Paquetería', options: opts, defaultValue: 'ups', disabled: true }))));
</script>
